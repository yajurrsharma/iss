<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-white selection:text-black p-4 sm:p-8">
    <header class="border-2 border-white px-4 py-3 flex justify-between items-center max-w-3xl mx-auto w-full bg-black mb-6">
        <div class="flex items-center gap-2">
            <span class="w-3 h-3 bg-white inline-block"></span>
            <span class="text-xs tracking-widest">HACKCLUB</span>
        </div>
        <a href="https://github.com/yajurrsharma/iss" target="_blank" class="text-xs text-zinc-400 hover:text">github</a>
    </header>

    <main class="max-w-3xl mx-auto w-full flex flex-col justify-center items-center flex-grow gap-6">

        <div class="border-2 border-white bg-black p-6 w-full text-center">
            <h1 class="text-ts uppercase tracking-widest text-zinc-400 mb-6 border-b border-zinc-800 pb-2 text-center">HORIZON EVENT</h1>            

            <form id="subscribe-form" onsubmit="handleSubscribe(event)" class="space-y-4 text-left">
                <div>
                    <label class="block text-[10px] text-zinc-400 mb-2 text-center">EMAIL</label>
                    <input type="email" id="email" required placeholder="enter your email here!" class="w-full bg-black border-2 border-zinc-700 focus:border-white px-3 py-3 text-xs text-white focus:outline-none text-center">
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-[10px] text-zinc-400 mb-2 text-center">LAT'</label>
                        <input type="number" step="any" id="lat" required placeholder="enter your lat' here!" class="w-full bg-black border-2 border-zinc-700 focus:border-white px-3 py-3 text-xs text-white focus:outline-none text-center">

                    </div>
                        <div>
                        <label class="block text-[10px] text-zinc-400 mb-2 text-center">LONG'</label>
                        <input type="number" step="any" id="long" required placeholder="enter your long' here!" class="w-full bg-black border-2 border-zinc-700 focus:border-white px-3 py-3 text-xs text-white focus:outline-none text-center">

                    </div>

                </div>

                <button type="submit" class="w-full py-3.5 border-2 border-white bg-white hover:bg-black hover:text-white text-black text-xs font-bold transition mt-4 cursor-pointer">
                    SUBSCRIBE
                </button>
            </form>
            <p id="response-msg" class="text-[10px] mt-4 hidden text-center"></p>
        </div>
    </main>

    <footer class="border-t-2 border-zinc-800 pt-4 mt-8 text-center text-zinc-600 text-[10px] max-w-3xl mx-auto w-full">
        <p>Made with ❤️ and lots of coffee by <a href="https://yajurrsharma.github.io/site" target="_blank" class="text-zinc-400 hover:text-white">Yajur.</a> For HackClub, By a HackClubber.</p>

    </footer>

    <script src="app.js"></script>
</body>
</html>
